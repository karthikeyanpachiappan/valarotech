<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="t d">
  <title id="t">From manual releases to automated delivery</title>
  <desc id="d">On the left, tangled manual release steps with warnings and late-night clocks; on the right, a clean automated pipeline with passing checks and a rising deployment trend.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a3337"/><stop offset="1" stop-color="#062a2e"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#059669"/><stop offset=".5" stop-color="#10b981"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
    <radialGradient id="glowR" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#10b981" stop-opacity=".45"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowL" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f97316" stop-opacity=".22"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="640" height="560" rx="28" fill="url(#bg)"/>
  <rect width="640" height="560" rx="28" fill="url(#grid)"/>
  <circle cx="150" cy="300" r="190" fill="url(#glowL)"/>
  <circle cx="490" cy="300" r="200" fill="url(#glowR)"/>

  <g font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-weight="800" font-size="15" letter-spacing="2">
    <text x="60" y="64" fill="#fdba74">BEFORE</text>
    <text x="380" y="64" fill="#5eead4">AFTER</text>
  </g>

  <!-- BEFORE: tangled manual process -->
  <g fill="none" stroke-linecap="round">
    <path d="M70 150 C 150 120, 120 230, 200 200 S 120 320, 230 300 S 90 390, 180 430" stroke="#fdba74" stroke-opacity=".7" stroke-width="3" stroke-dasharray="6 8"/>
    <path d="M90 120 C 220 180, 60 260, 210 250 S 160 380, 250 400" stroke="#f87171" stroke-opacity=".55" stroke-width="3"/>
    <path d="M60 260 C 140 230, 190 340, 120 360 S 220 470, 250 460" stroke="#fbbf24" stroke-opacity=".5" stroke-width="3"/>
  </g>
  <!-- manual checklist card -->
  <g transform="translate(64 96)">
    <rect width="120" height="82" rx="12" fill="#0d3b40" stroke="#ffffff" stroke-opacity=".12"/>
    <g stroke="#c5d9d6" stroke-width="3" stroke-linecap="round"><path d="M16 22h56M16 42h72M16 62h44"/></g>
    <g fill="none" stroke="#f87171" stroke-width="3" stroke-linecap="round"><path d="M92 16 l12 12 M104 16 l-12 12"/></g>
  </g>
  <!-- warning -->
  <g transform="translate(206 186)">
    <path d="M0 -26 L26 20 H-26 Z" fill="#f97316" fill-opacity=".9"/>
    <path d="M0 -10 V6" stroke="#062a2e" stroke-width="4" stroke-linecap="round"/><circle cx="0" cy="13" r="2.6" fill="#062a2e"/>
  </g>
  <!-- late-night clock -->
  <g transform="translate(110 330)">
    <circle r="30" fill="#0d3b40" stroke="#fdba74" stroke-width="3"/>
    <path d="M0 -16 V0 L12 8" fill="none" stroke="#fdba74" stroke-width="3.4" stroke-linecap="round"/>
    <text x="-20" y="52" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#fdba74">2:00 AM</text>
  </g>
  <!-- failed deploy chip -->
  <g transform="translate(150 438)">
    <rect width="132" height="34" rx="17" fill="#3b1d1d" stroke="#f87171" stroke-opacity=".6"/>
    <circle cx="20" cy="17" r="7" fill="#f87171"/>
    <text x="36" y="22" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#fecaca">Deploy failed</text>
  </g>

  <!-- arrow in the middle -->
  <g transform="translate(320 290)">
    <circle r="30" fill="#10b981"/>
    <path d="M-12 0 H10 M2 -9 L11 0 L2 9" fill="none" stroke="#04221f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- AFTER: clean pipeline -->
  <g transform="translate(392 112)">
    <rect width="190" height="250" rx="18" fill="#0d3b40" stroke="#ffffff" stroke-opacity=".12"/>
    <g font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#dcebe8">
      <g transform="translate(18 30)"><circle cx="11" cy="0" r="11" fill="#10b981"/><path d="M6 0 l3.5 3.5 l6-7" fill="none" stroke="#04221f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="5">Build</text></g>
      <g transform="translate(18 76)"><circle cx="11" cy="0" r="11" fill="#10b981"/><path d="M6 0 l3.5 3.5 l6-7" fill="none" stroke="#04221f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="5">Test</text></g>
      <g transform="translate(18 122)"><circle cx="11" cy="0" r="11" fill="#10b981"/><path d="M6 0 l3.5 3.5 l6-7" fill="none" stroke="#04221f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="5">Security scan</text></g>
      <g transform="translate(18 168)"><circle cx="11" cy="0" r="11" fill="#10b981"/><path d="M6 0 l3.5 3.5 l6-7" fill="none" stroke="#04221f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="5">Infra as code</text></g>
      <g transform="translate(18 214)"><circle cx="11" cy="0" r="11" fill="#5eead4"/><path d="M7 -5 l8 5 l-8 5 z" fill="#04221f"/><text x="32" y="5" fill="#fff">Deployed</text></g>
    </g>
    <path d="M29 41 V65 M29 87 V111 M29 133 V157 M29 179 V203" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- rising trend -->
  <g transform="translate(392 392)">
    <rect width="190" height="96" rx="16" fill="#0d3b40" stroke="#ffffff" stroke-opacity=".12"/>
    <path d="M20 76 L60 60 L96 64 L132 38 L170 22" fill="none" stroke="url(#brand)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="170" cy="22" r="5" fill="#5eead4"/>
    <text x="20" y="28" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#8aa9a4">Deploys / week</text>
  </g>
</svg>
