<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
  <title id="t">From message to plan</title>
  <desc id="d">Your message, a reply within one business day, a short call on the calendar, and a written plan with quick wins.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1c3f"/><stop offset="1" stop-color="#0b1530"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8590c"/><stop offset=".5" stop-color="#ff6a2b"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff6a2b" stop-opacity=".4"/><stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="640" height="400" rx="28" fill="url(#bg)"/>
  <rect width="640" height="400" rx="28" fill="url(#grid)"/>
  <circle cx="330" cy="200" r="220" fill="url(#glow)"/>

  <path d="M150 200 C 210 120, 250 120, 300 150 S 400 290, 480 200" fill="none" stroke="url(#brand)" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>

  <g font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif">
    <!-- message bubble -->
    <g transform="translate(40 120)">
      <path d="M0 18 a18 18 0 0 1 18 -18 h140 a18 18 0 0 1 18 18 v66 a18 18 0 0 1 -18 18 h-112 l-24 22 v-22 h-4 a18 18 0 0 1 -18 -18 z" fill="#13214a" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="20" y="34" font-size="15" font-weight="800" fill="#fff">Hi Valarotech 👋</text>
      <g stroke="#9aa8bf" stroke-width="3.4" stroke-linecap="round"><path d="M20 56 h130 M20 76 h96"/></g>
    </g>

    <!-- reply chip -->
    <g transform="translate(218 60)">
      <rect width="206" height="40" rx="20" fill="#ff6a2b"/>
      <path d="M22 20 l5 5 l9 -10" fill="none" stroke="#0b1530" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="25" font-size="13" font-weight="800" fill="#0b1530">Reply in 1 business day</text>
    </g>

    <!-- calendar -->
    <g transform="translate(250 170)">
      <rect width="140" height="140" rx="18" fill="#13214a" stroke="#ffffff" stroke-opacity=".14"/>
      <rect width="140" height="38" rx="18" fill="#ff6a2b"/><rect y="20" width="140" height="18" fill="#ff6a2b"/>
      <text x="70" y="26" text-anchor="middle" font-size="13" font-weight="800" fill="#0b1530">30-MIN CALL</text>
      <g fill="#1d3166">
        <rect x="16" y="52" width="22" height="18" rx="4"/><rect x="46" y="52" width="22" height="18" rx="4"/><rect x="76" y="52" width="22" height="18" rx="4"/><rect x="106" y="52" width="22" height="18" rx="4"/>
        <rect x="16" y="78" width="22" height="18" rx="4"/><rect x="76" y="78" width="22" height="18" rx="4"/><rect x="106" y="78" width="22" height="18" rx="4"/>
        <rect x="16" y="104" width="22" height="18" rx="4"/><rect x="46" y="104" width="22" height="18" rx="4"/><rect x="76" y="104" width="22" height="18" rx="4"/>
      </g>
      <rect x="46" y="78" width="22" height="18" rx="4" fill="#ffb347"/>
      <path d="M51 87 l4 4 l8 -8" fill="none" stroke="#0b1530" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- plan document -->
    <g transform="translate(450 110)">
      <rect width="150" height="190" rx="18" fill="#13214a" stroke="url(#brand)" stroke-width="2"/>
      <text x="20" y="38" font-size="15" font-weight="800" fill="#fff">Your plan</text>
      <g font-size="12" font-weight="700" fill="#dbe3f0">
        <g transform="translate(20 64)"><circle cx="8" cy="0" r="8" fill="#ff6a2b"/><path d="M4 0 l3 3 l5 -6" fill="none" stroke="#0b1530" stroke-width="2.2" stroke-linecap="round"/><text x="24" y="4">Quick wins</text></g>
        <g transform="translate(20 96)"><circle cx="8" cy="0" r="8" fill="#ff6a2b"/><path d="M4 0 l3 3 l5 -6" fill="none" stroke="#0b1530" stroke-width="2.2" stroke-linecap="round"/><text x="24" y="4">Roadmap</text></g>
        <g transform="translate(20 128)"><circle cx="8" cy="0" r="8" fill="#ff6a2b"/><path d="M4 0 l3 3 l5 -6" fill="none" stroke="#0b1530" stroke-width="2.2" stroke-linecap="round"/><text x="24" y="4">Estimate</text></g>
      </g>
      <rect x="20" y="152" width="110" height="20" rx="10" fill="#ffb347" fill-opacity=".2"/>
      <text x="75" y="166" text-anchor="middle" font-size="11" font-weight="800" fill="#ffb347">FREE</text>
    </g>
  </g>
</svg>
